# Snapshot of the SHIPPED v1.8.0 salesforce policy (before the
# harness-driven Competitor__c fix). Used to reproduce verification run 1:
#   python scripts/verify_replay.py report answers.run1.json \
#       ../salesforce.spec.yaml --policies-dir policies.v1.8.0
connector: salesforce
version: 1

defaults:
  strip_metadata: true
  drop_empty_fields: true
  block_write_actions: false
  cache_ttl: 30

tools:
  get_lead:
    allow_fields:
      - Id
      - FirstName
      - LastName
      - Email
      - Phone
      - Company
      - Title
      - Status
      - LeadSource
      - OwnerId
      - Rating
    redact_pii:
      fields: [Email, Phone]
      mode: hash
    cache_ttl: 60

  list_leads:
    allow_fields:
      - Id
      - Name
      - Company
      - Status
      - LeadSource
    max_response_tokens: 2000
    cache_ttl: 15

  get_opportunity:
    allow_fields:
      - Id
      - Name
      - Amount
      - StageName
      - CloseDate
      - AccountId
      - OwnerId
      - Probability
      - NextStep
    cache_ttl: 120

  get_account:
    allow_fields:
      - Id
      - Name
      - Industry
      - NumberOfEmployees
      - AnnualRevenue
      - BillingCountry
      - BillingCity
      - Website
      - Phone
    cache_ttl: 600

  get_contact:
    allow_fields:
      - Id
      - FirstName
      - LastName
      - Email
      - Phone
      - Title
      - AccountId
      - Department
    redact_pii:
      fields: [Email, Phone]
      mode: hash
    cache_ttl: 300
