# SPDX-License-Identifier: Apache-2.0
# Example quality-verification spec for the bundled `orders` policy.
#
# Run (any OpenAI-compatible endpoint works — OpenAI, Ollama, vLLM):
#
#   cd services/proxy
#   python -m plinth_proxy.verify examples/verify/orders.spec.yaml \
#       --base-url http://localhost:11434/v1 --model llama3.1
#
# Exit code 0 = every answer identical between raw and shaped context.

connector: orders

cases:
  - tool: get_order
    raw_response:
      orderId: "ORD-2024-78421"
      customerName: "Acme GmbH"
      status: "in_transit"
      trackingNumber: "1Z999AA10123456784"
      estimatedDelivery: "2026-06-12"
      carrier: "UPS"
      totalAmount: 1249.99
      itemsSummary: "3x Widget Pro, 1x Mounting Kit"
      currency: "EUR"
      internalRoutingCode: "WH3-X-441"
      paymentProcessorRef: "stripe_pi_3NqK8aLkdIwHu7ix"
      fraudScore: 0.02
      warehouseNotes: null
      giftMessage: ""
      promoCodes: []
      customFields: {}
      createdAt: "2026-06-01T10:02:11Z"
      updatedAt: "2026-06-09T08:12:44Z"
      createdBy: "shop-frontend-7"
      etag: 'W/"order-78421-v7"'
      _version: 7
      auditTrail:
        - { event: "created", at: "2026-06-01T10:02:11Z", actor: "system" }
        - { event: "shipped", at: "2026-06-05T15:09:51Z", actor: "ups-edi" }
      lineItems:
        - sku: "WID-PRO-2026"
          qty: 3
          unitPrice: 399.99
          taxCode: "DE19"
          warehouseBin: "A-12-3"
          discountCode: null
    questions:
      - "What is the status of the order?"
      - "Which carrier is delivering the order?"
      - "What is the tracking number?"
      - "When is the estimated delivery?"
      - "What is the total amount of the order?"

  - tool: get_customer
    raw_response:
      customerId: "CUST-1182"
      name: "Acme GmbH"
      tier: "gold"
      accountStatus: "active"
      email: "ops@acme.example"
      phone: "+49 89 555 0142"
      internalCreditScore: 91
      marketingSegments: ["b2b", "de-south"]
      createdAt: "2023-04-02T08:00:00Z"
      notes: null
    questions:
      - "What tier is this customer in?"
      - "Is the customer's account active?"
