# SPDX-License-Identifier: Apache-2.0
# Quality-verification spec — Slack connector, realistic conversations
# payload (envelope + blocks + reactions noise, as the Web API returns it).
#
# Includes a count question ("how many messages…") because the lossless
# layer guarantees list length is preserved — the harness proves it.
#
#   python -m plinth_proxy.verify examples/verify/slack.spec.yaml \
#       --base-url ... --model ...

