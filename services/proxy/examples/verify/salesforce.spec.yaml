# SPDX-License-Identifier: Apache-2.0
# Quality-verification spec — Salesforce connector, realistic fat objects.
#
# The payloads mirror real Salesforce REST responses (50+ fields, attributes
# wrapper, audit columns, nulled custom fields). Questions are what a
# sales-assistant agent actually asks. One question deliberately probes a
# field outside the shipped keep-list (Competitor__c) — the harness exists
# precisely to surface that kind of gap.
#
#   python -m plinth_proxy.verify examples/verify/salesforce.spec.yaml \
#       --base-url ... --model ...

connector: salesforce

