[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  # Cloud endpoints baked into signup/login/welcome/connect at build time.
  # api.plynf.com = control plane (signup, billing, webhooks)
  # app.plynf.com = the proxy customers point their agents at
  PUBLIC_PLYNF_API = "https://api.plynf.com"
  PUBLIC_PLYNF_ENDPOINT = "https://app.plynf.com/v1"

# ─── /install.sh shortcut ─────────────────────────────────────────────
# Lets users do `curl -fsSL https://plynf.com/install.sh | sh` instead of
# pasting the raw-GitHub URL. The 302 means we can rotate the source
# without breaking the cached one-liner.
[[redirects]]
  from = "/install.sh"
  to = "https://raw.githubusercontent.com/nico-schindlbeck-jpg/plynf/main/scripts/install-plynf.sh"
  status = 302
  force = true

# ─── Public launch ────────────────────────────────────────────────────
# The preview-site Basic-Auth gate (edge function "auth") was removed on
# go-live (2026-06-10). The site is fully public.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.github.com https://app.plynf.com https://api.plynf.com http://localhost:7424; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ─── Installer pipes ──────────────────────────────────────────────────
# install.sh is served DIRECTLY from landing/public/install.sh — no
# redirect needed. The previous setup pointed at raw.githubusercontent.com
# which 404s while the repo is private. Source of truth stays in
# install/install.sh; landing/public/install.sh is a deploy-time copy.
#
# install.ps1 doesn't exist yet — when added, place it in public/ same way.
[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

# ─── GitHub aliases ───────────────────────────────────────────────────
[[redirects]]
  from = "/github"
  to = "https://github.com/nico-schindlbeck-jpg/plynf"
  status = 302

[[redirects]]
  from = "/repo"
  to = "https://github.com/nico-schindlbeck-jpg/plynf"
  status = 302

[[redirects]]
  from = "/releases"
  to = "https://github.com/nico-schindlbeck-jpg/plynf/releases"
  status = 302

[[redirects]]
  from = "/issues"
  to = "https://github.com/nico-schindlbeck-jpg/plynf/issues"
  status = 302

# ─── Subdomain placeholders (point at GitHub until real surfaces exist) ─
[[redirects]]
  from = "/docs"
  to = "https://github.com/nico-schindlbeck-jpg/plynf/tree/main/docs"
  status = 302

# Discord doesn't exist yet — funnel users to GitHub Discussions
# until a real invite is created.
[[redirects]]
  from = "/discord"
  to = "https://github.com/nico-schindlbeck-jpg/plynf/discussions"
  status = 302

# ─── Misc ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/og.jpg"
  to = "/og-image.svg"
  status = 301
