# Plynf — production stack from GHCR pre-built images.
#
# Usage:
#   export PLYNF_ORG="plynf"   # or the future plynf GitHub org
#   export PLYNF_VERSION="v1.7"               # or any released tag
#   docker compose -f deploy/compose.prod.yml pull
#   docker compose -f deploy/compose.prod.yml up -d --wait
#
# Differences from the root docker-compose.yml:
#   - No `build:` directives. Images are pulled from ghcr.io, not built
#     locally. Cold-start time drops from 8-15 min (local build) to
#     30-90s (parallel pull).
#   - `pull_policy: always` so a `compose up` always picks up newer tags
#     when PLYNF_VERSION moves.
#   - Images are signed (cosign keyless) and have SBOM attestations
#     attached. See deploy/registry.md for verification.
#
# Internal env vars keep their PLINTH_ prefix — that's the runtime API
# contract baked into services. Don't rename without coordinating a
# migration (would break existing users' data dirs and config).
#
# To pin to immutable digests instead of mutable tags, run:
#   scripts/pin-compose-digests.sh deploy/compose.prod.yml v1.7
# Produces deploy/compose.prod.pinned.yml with @sha256:... refs.

# ─── Shared YAML anchors ──────────────────────────────────────────────
x-defaults: &defaults
  pull_policy: always
  restart: unless-stopped

x-logging: &logging
  PLINTH_LOG_LEVEL: "${PLINTH_LOG_LEVEL:-INFO}"
  PLINTH_LOG_FORMAT: "${PLINTH_LOG_FORMAT:-json}"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 8s

services:
  # ─── Core platform services ─────────────────────────────────────────

  workspace:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-workspace:${PLYNF_VERSION:-latest}
    container_name: plynf-workspace
    ports:
      - "${PLINTH_WORKSPACE_PORT:-7421}:7421"
    environment:
      <<: *logging
      PLINTH_DATA_DIR: /data
      PLINTH_WORKSPACE_PORT: "7421"
    volumes:
      - workspace_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7421/healthz\").read()'"]

  gateway:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-gateway:${PLYNF_VERSION:-latest}
    container_name: plynf-gateway
    ports:
      - "${PLINTH_GATEWAY_PORT:-7422}:7422"
    environment:
      <<: *logging
      PLINTH_DATA_DIR: /data
      PLINTH_GATEWAY_PORT: "7422"
      PLINTH_WORKSPACE_URL: "http://workspace:7421"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    volumes:
      - gateway_data:/data
    depends_on:
      workspace:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7422/healthz\").read()'"]

  identity:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-identity:${PLYNF_VERSION:-latest}
    container_name: plynf-identity
    ports:
      - "${PLINTH_IDENTITY_PORT:-7425}:7425"
    environment:
      <<: *logging
      PLINTH_IDENTITY_DATA_DIR: /data
      PLINTH_IDENTITY_PORT: "7425"
    volumes:
      - identity_data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7425/healthz\").read()'"]

  dashboard:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-dashboard:${PLYNF_VERSION:-latest}
    container_name: plynf-dashboard
    ports:
      - "${PLINTH_DASHBOARD_PORT:-7424}:7424"
    environment:
      <<: *logging
      PLINTH_DASHBOARD_PORT: "7424"
      # NB: the dashboard reads the PLINTH_DASHBOARD_ prefix (the core services
      # use plain PLINTH_), so these MUST carry the infix to be picked up.
      # Pointing them at the in-network services is what makes the dashboard's
      # live telemetry + session minting work (not just the seeded demo data).
      PLINTH_DASHBOARD_WORKSPACE_URL: "http://workspace:7421"
      PLINTH_DASHBOARD_GATEWAY_URL: "http://gateway:7422"
      PLINTH_DASHBOARD_IDENTITY_URL: "http://identity:7425"
      PLINTH_DASHBOARD_PROXY_URL: "http://proxy:7430"
      # Flip auth on in prod via .env. CORS must list the site origin
      # (plynf.com) — the built-in default omits it.
      PLINTH_DASHBOARD_APP_AUTH_REQUIRED: "${PLINTH_DASHBOARD_APP_AUTH_REQUIRED:-false}"
      PLINTH_DASHBOARD_CORS_ORIGINS: "${PLINTH_DASHBOARD_CORS_ORIGINS:-https://plynf.com,https://app.plynf.com}"
      # ── Self-serve accounts + billing (signup → checkout → key → done) ──
      # Accounts persist in Postgres (durable, pg_dump-able, table `accounts`
      # in the same DB the proxy uses). Set PLINTH_DASHBOARD_ACCOUNTS_DB_URL=""
      # in .env to fall back to the JSON file on the named volume. Internal
      # secret protects the proxy-facing key resolver; Stripe vars empty =
      # simulated billing — see GO_LIVE.md step "Stripe".
      PLINTH_DASHBOARD_ACCOUNTS_DB_URL: "${PLINTH_DASHBOARD_ACCOUNTS_DB_URL:-postgresql://plynf:plynf@postgres:5432/plynf}"
      PLINTH_DASHBOARD_ACCOUNTS_PATH: "/data/plynf-accounts.json"
      PLINTH_DASHBOARD_INTERNAL_SECRET: "${PLINTH_INTERNAL_SECRET:?set PLINTH_INTERNAL_SECRET in deploy/.env}"
      PLINTH_DASHBOARD_SITE_URL: "${PLINTH_SITE_URL:-https://plynf.com}"
      PLINTH_DASHBOARD_STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      PLINTH_DASHBOARD_STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      PLINTH_DASHBOARD_STRIPE_PRICE_PRO: "${STRIPE_PRICE_PRO:-}"
      PLINTH_DASHBOARD_STRIPE_PRICE_ENTERPRISE: "${STRIPE_PRICE_ENTERPRISE:-}"
    volumes:
      - dashboard-data:/data
    depends_on:
      workspace:
        condition: service_healthy
      gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7424/healthz\").read()'"]

  # ─── Postgres (durable savings sink) ────────────────────────────────
  # The proxy persists savings events here so the dashboard's token/cost
  # totals survive restarts (the in-memory mirror does not). Internal network
  # only — not published on the host. Change POSTGRES_PASSWORD for a real deploy.
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: plynf-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-plynf}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-plynf}"
      POSTGRES_DB: "${POSTGRES_DB:-plynf}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plynf} -d ${POSTGRES_DB:-plynf}"]

  # ─── LLM proxy (the response-shaping front door for models) ─────────
  # Boots in safe MOCK mode (no upstream key needed). To forward to a real
  # model, set PLINTH_PROXY_DEMO_MODE=false and the two UPSTREAM_* vars in
  # your .env — see deploy/prod.env.example. Published on host 7434 because
  # google-mcp already owns 7430.
  proxy:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-proxy:${PLYNF_VERSION:-latest}
    container_name: plynf-proxy
    ports:
      - "${PLINTH_PROXY_PORT:-7434}:7430"
    environment:
      <<: *logging
      PLINTH_PROXY_HOST: "0.0.0.0"
      PLINTH_PROXY_PORT: "7430"
      PLINTH_PROXY_DEMO_MODE: "${PLINTH_PROXY_DEMO_MODE:-true}"
      PLINTH_PROXY_UPSTREAM_BASE_URL: "${PLINTH_PROXY_UPSTREAM_BASE_URL:-}"
      PLINTH_PROXY_UPSTREAM_API_KEY: "${PLINTH_PROXY_UPSTREAM_API_KEY:-}"
      # Tenant keys the proxy accepts (tenant:key:tier, comma-separated).
      PLINTH_PROXY_API_KEYS: "${PLINTH_PROXY_API_KEYS:-}"
      # Self-serve customer keys resolve against the dashboard control plane
      # (same shared secret as the dashboard's INTERNAL_SECRET).
      PLINTH_PROXY_ACCOUNTS_URL: "http://dashboard:7424"
      PLINTH_PROXY_INTERNAL_SECRET: "${PLINTH_INTERNAL_SECRET:?set PLINTH_INTERNAL_SECRET in deploy/.env}"
      # Verify bearer tokens against identity; route tool calls to the gateway.
      PLINTH_PROXY_IDENTITY_URL: "http://identity:7425"
      PLINTH_PROXY_GATEWAY_URL: "http://gateway:7422"
      # Durable savings sink → feeds the dashboard's live KPIs. Postgres in
      # prod (survives restarts); the JSONL path is the fallback used only
      # when PLINTH_PROXY_POSTGRES_URL is empty.
      PLINTH_PROXY_POSTGRES_URL: "${PLINTH_PROXY_POSTGRES_URL:-postgresql://plynf:plynf@postgres:5432/plynf}"
      PLINTH_PROXY_SAVINGS_LOG: "/tmp/savings.jsonl"
    depends_on:
      identity:
        condition: service_healthy
      gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7430/healthz\").read()'"]

  # ─── Edge / TLS (reverse proxy with automatic HTTPS) ────────────────
  # Terminates TLS for ${PLYNF_APP_DOMAIN} and routes /v1/* + /api/chat* to
  # the proxy and everything else to the dashboard. Caddy fetches + renews
  # Let's Encrypt certs automatically once the domain's A record points here.
  caddy:
    <<: *defaults
    image: caddy:2-alpine
    container_name: plynf-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PLYNF_APP_DOMAIN: "${PLYNF_APP_DOMAIN:-app.plynf.com}"
      PLYNF_ACME_EMAIL: "${PLYNF_ACME_EMAIL:-admin@plynf.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
      proxy:
        condition: service_healthy

  # ─── Mock MCP (for demos + tests without real OAuth) ────────────────

  mock-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-mock-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-mock-mcp
    ports:
      - "${PLINTH_MOCK_MCP_PORT:-7423}:7423"
    environment:
      PLINTH_MOCK_PORT: "7423"
      PLINTH_MOCK_FIXTURES_DIR: /tmp/plynf-mock-fixtures
      PLINTH_MOCK_LOG_LEVEL: "${PLINTH_LOG_LEVEL:-INFO}"
      PLINTH_MOCK_LOG_FORMAT: "${PLINTH_LOG_FORMAT:-json}"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7423/healthz\").read()'"]

  # ─── OAuth MCP servers (eight providers) ────────────────────────────

  github-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-github-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-github-mcp
    ports:
      - "${PLINTH_GITHUB_MCP_PORT:-7426}:7426"
    environment:
      <<: *logging
      PLINTH_GITHUB_MCP_PORT: "7426"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7426/healthz\").read()'"]

  slack-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-slack-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-slack-mcp
    ports:
      - "${PLINTH_SLACK_MCP_PORT:-7427}:7427"
    environment:
      <<: *logging
      PLINTH_SLACK_MCP_PORT: "7427"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7427/healthz\").read()'"]

  linear-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-linear-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-linear-mcp
    ports:
      - "${PLINTH_LINEAR_MCP_PORT:-7428}:7428"
    environment:
      <<: *logging
      PLINTH_LINEAR_MCP_PORT: "7428"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7428/healthz\").read()'"]

  notion-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-notion-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-notion-mcp
    ports:
      - "${PLINTH_NOTION_MCP_PORT:-7429}:7429"
    environment:
      <<: *logging
      PLINTH_NOTION_MCP_PORT: "7429"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7429/healthz\").read()'"]

  google-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-google-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-google-mcp
    ports:
      - "${PLINTH_GOOGLE_MCP_PORT:-7430}:7430"
    environment:
      <<: *logging
      PLINTH_GOOGLE_MCP_PORT: "7430"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7430/healthz\").read()'"]

  atlassian-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-atlassian-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-atlassian-mcp
    ports:
      - "${PLINTH_ATLASSIAN_MCP_PORT:-7431}:7431"
    environment:
      <<: *logging
      PLINTH_ATLASSIAN_MCP_PORT: "7431"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7431/healthz\").read()'"]

  salesforce-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-salesforce-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-salesforce-mcp
    ports:
      - "${PLINTH_SALESFORCE_MCP_PORT:-7432}:7432"
    environment:
      <<: *logging
      PLINTH_SALESFORCE_MCP_PORT: "7432"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7432/healthz\").read()'"]

  asana-mcp:
    <<: *defaults
    image: ghcr.io/${PLYNF_ORG:-plynf}/plynf-asana-mcp:${PLYNF_VERSION:-latest}
    container_name: plynf-asana-mcp
    ports:
      - "${PLINTH_ASANA_MCP_PORT:-7433}:7433"
    environment:
      <<: *logging
      PLINTH_ASANA_MCP_PORT: "7433"
      PLINTH_IDENTITY_URL: "http://identity:7425"
    depends_on:
      identity:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7433/healthz\").read()'"]

volumes:
  dashboard-data:
  workspace_data:
    name: plynf_workspace_data
  gateway_data:
    name: plynf_gateway_data
  identity_data:
    name: plynf_identity_data
  caddy_data:
    name: plynf_caddy_data
  caddy_config:
    name: plynf_caddy_config
  postgres_data:
    name: plynf_postgres_data
